name: Deploy to AWS ECS

on:
  workflow_dispatch:  # Manual trigger
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main
      - release

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: theo-prod
  BACKEND_SERVICE: theo-backend
  FRONTEND_SERVICE: theo-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if Docker Build workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy backend service
      run: |
        echo "Deploying backend service to ECS..."
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.BACKEND_SERVICE }} \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

        echo "✓ Backend deployment initiated"

    - name: Deploy frontend service
      run: |
        echo "Deploying frontend service to ECS..."
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.FRONTEND_SERVICE }} \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

        echo "✓ Frontend deployment initiated"

    - name: Wait for services to stabilize
      run: |
        echo "Waiting for backend service to stabilize..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.BACKEND_SERVICE }} \
          --region ${{ env.AWS_REGION }}

        echo "Waiting for frontend service to stabilize..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.FRONTEND_SERVICE }} \
          --region ${{ env.AWS_REGION }}

        echo "✓ All services deployed successfully!"
