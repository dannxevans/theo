name: Cleanup Old Docker Images

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: dannxevans

jobs:
  cleanup:
    name: Delete Old SHA-tagged Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [theo-backend, theo-frontend]
      fail-fast: false  # Continue cleanup for other images even if one fails

    steps:
      - name: Delete old images for ${{ matrix.image }}
        uses: actions/delete-package-versions@v5
        continue-on-error: true  # Don't fail if package metadata becomes unavailable after cleanup
        with:
          package-name: ${{ matrix.image }}
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: false
          ignore-versions: '^(latest|dev)$'  # Only keep 'latest' and 'dev' tags permanently
