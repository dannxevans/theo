name: Build, Publish & Deploy

on:
  push:
    branches:
      - release
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '!backend/tests/**'
      - '!frontend/src/**/*.test.js'
      - '!frontend/src/**/*.spec.js'
      - '!.github/**'
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: dannxevans
  AWS_REGION: eu-west-2
  ECS_CLUSTER: theo-prod
  BACKEND_SERVICE: theo-backend
  FRONTEND_SERVICE: theo-frontend

jobs:
  build-and-push:
    name: Build Image to Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Determine deterministic tags
      # -------------------------------
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Extract PR number from merge commit message
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP 'Merge pull request #\K\d+' || echo "")

          # Determine primary deployment tag
          if [[ -n "$PR_NUMBER" ]]; then
            # PR merge - use PR number as primary tag
            DEPLOY_TAG="pr-${PR_NUMBER}"
            echo "📦 Detected PR merge: #${PR_NUMBER}"
          else
            # Direct push or manual trigger - use commit SHA
            DEPLOY_TAG="git-${SHORT_SHA}"
            echo "📦 Direct push detected, using commit: ${SHORT_SHA}"
          fi

          # Version tag for compatibility
          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            VERSION_TAG=latest
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            VERSION_TAG=dev
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
          else
            VERSION_TAG=unknown
          fi

          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=git-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

          echo "🏷️  Tags:"
          echo "  - Deploy: ${DEPLOY_TAG}"
          echo "  - SHA: git-${SHORT_SHA}"
          echo "  - Version: ${VERSION_TAG}"

      # ---------- FRONTEND ----------
      - name: Frontend Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.deploy_tag }} \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.version_tag }} \
            -f frontend/Dockerfile \
            --push frontend

      # ---------- BACKEND ----------
      - name: Backend Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.deploy_tag }} \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.version_tag }} \
            -f backend/Dockerfile \
            --push backend

  deploy-to-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only deploy on release branch or manual trigger, not on tags
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compute deployment tag
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP 'Merge pull request #\K\d+' || echo "")

          if [[ -n "$PR_NUMBER" ]]; then
            DEPLOY_TAG="pr-${PR_NUMBER}"
          else
            DEPLOY_TAG="git-${SHORT_SHA}"
          fi

          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "🚀 Deploying tag: ${DEPLOY_TAG}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update backend task definition
        run: |
          echo "📝 Updating backend task definition..."

          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition theo-backend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition')

          # Update image with new tag
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/theo-backend:${{ steps.meta.outputs.deploy_tag }}"

          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition revision
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region ${{ env.AWS_REGION }}

          echo "✅ Backend task definition updated with image: $NEW_IMAGE"

      - name: Deploy backend service
        run: |
          echo "🚀 Deploying backend service to ECS..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.BACKEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "✅ Backend deployment initiated"

      - name: Update frontend task definition
        run: |
          echo "📝 Updating frontend task definition..."

          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition theo-frontend \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition')

          # Update image with new tag
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/theo-frontend:${{ steps.meta.outputs.deploy_tag }}"

          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition revision
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region ${{ env.AWS_REGION }}

          echo "✅ Frontend task definition updated with image: $NEW_IMAGE"

      - name: Deploy frontend service
        run: |
          echo "🚀 Deploying frontend service to ECS..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.FRONTEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "✅ Frontend deployment initiated"

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for backend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for frontend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "All services deployed successfully!"