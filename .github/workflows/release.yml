name: Build & Publish THEO Images

on:
  push:
    branches:
      - release
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: dannxevans

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=latest
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ---------- FRONTEND ----------
      - name: Build & push frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.version.outputs.version }} \
            -t $REGISTRY/$OWNER/theo-frontend:latest \
            -f frontend/Dockerfile \
            --push frontend

      # ---------- BACKEND ----------
      - name: Build & push backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.version.outputs.version }} \
            -t $REGISTRY/$OWNER/theo-backend:latest \
            -f backend/Dockerfile \
            --push backend