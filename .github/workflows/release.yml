name: Build & Publish Images

on:
  push:
    branches:
      - release
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '!backend/tests/**'
      - '!frontend/src/**/*.test.js'
      - '!frontend/src/**/*.spec.js'
      - '!.github/**'
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: dannxevans

jobs:
  build-and-push:
    name: Build Image to Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Determine deterministic tags
      # -------------------------------
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          # Extract PR number from merge commit message
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP 'Merge pull request #\K\d+' || echo "")

          # Determine primary deployment tag
          if [[ -n "$PR_NUMBER" ]]; then
            # PR merge - use PR number as primary tag
            DEPLOY_TAG="pr-${PR_NUMBER}"
            echo "📦 Detected PR merge: #${PR_NUMBER}"
          else
            # Direct push or manual trigger - use commit SHA
            DEPLOY_TAG="git-${SHORT_SHA}"
            echo "📦 Direct push detected, using commit: ${SHORT_SHA}"
          fi

          # Version tag for compatibility
          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            VERSION_TAG=latest
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            VERSION_TAG=dev
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
          else
            VERSION_TAG=unknown
          fi

          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=git-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

          echo "🏷️  Tags:"
          echo "  - Deploy: ${DEPLOY_TAG}"
          echo "  - SHA: git-${SHORT_SHA}"
          echo "  - Version: ${VERSION_TAG}"

      # ---------- FRONTEND ----------
      - name: Frontend Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.deploy_tag }} \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.version_tag }} \
            -f frontend/Dockerfile \
            --push frontend

      # ---------- BACKEND ----------
      - name: Backend Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.deploy_tag }} \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.version_tag }} \
            -f backend/Dockerfile \
            --push backend

