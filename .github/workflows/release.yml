name: Build & Publish THEO Images

on:
  push:
    branches:
      - release
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: dannxevans

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Determine deterministic tags
      # -------------------------------
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "${GITHUB_REF}" == refs/heads/release ]]; then
            VERSION_TAG=latest
          elif [[ "${GITHUB_REF}" == refs/heads/dev ]]; then
            VERSION_TAG=dev
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/v}
          else
            VERSION_TAG=unknown
          fi

          echo "sha_tag=git-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

      # ---------- FRONTEND ----------
      - name: Build & push frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-frontend:${{ steps.meta.outputs.version_tag }} \
            -f frontend/Dockerfile \
            --push frontend

      # ---------- BACKEND ----------
      - name: Build & push backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.sha_tag }} \
            -t $REGISTRY/$OWNER/theo-backend:${{ steps.meta.outputs.version_tag }} \
            -f backend/Dockerfile \
            --push backend